<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <main class="form-container">
        <h1>Student Admission Form</h1>
        <p>Please fill in the following information carefully.</p>
        <!-- main form -->
        <form action="#" method="post">
            <!-- personal information -->
            <fieldset>
                <legend>Personal Information</legend>
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" placeholder="Enter your Full Name" required>
                <label for="father-name">Father Name</label>
                <input type="text" id="father-name" name="father-name" placeholder="Enter your Father Name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="create your password" required>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
                <label>Gender</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="female">other</label>
                </div>
            </fieldset>
            <!-- Academic Information -->
            <fieldset>
                <legend>Academic Information </legend>
                <!-- course -->
                <label for="course">Select Course</label>
                <select name="course" id="course" required>
                    <option value="">--Select Course--</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Information Tech">Information Tech</option>
                    <option value="Data Science">Data Science</option>

                </select>

                <!-- Previous Education -->
                <label for="education">Previous Education</label>
                <select name="education" id="education">
                    <option value="">--select--</option>
                    <option value="metric">Metric</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="bachelor">Bachelors's Degree</option>
                </select>
                <!-- Marks -->
                <label for="marks">Previous Marks</label>
                <input type="number" id="marks" name="percentage" placeholder="Enter percentages" min="0" max="100">

            </fieldset>
            <!-- Contact Info -->
            <fieldset>
                <legend>Contact Information</legend>
                <!-- phone -->
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="0300-0000000" required>
                <!-- address -->
                <label for="address">Address</label>
                <textarea name="address" id="address" placeholder="Enter your complete address"></textarea>
            </fieldset>
            <!-- Interests -->
             <fieldset>
                <legend>Interests</legend>
                <label for="">Select Your Interests</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="web" name="interests" value="web-dev">
                    <label for="web">Web-Development</label>
                    <input type="checkbox" id="ai" name="interests" value="ai">
                    <label for="ai">Artificial Int</label>
                    <input type="checkbox" id="design" name="interests" value="design">
                    <label for="design">UI/UX Design</label>
                </div>
             </fieldset>

             <!-- Terms -->
              <fieldset>
                <legend>Confirmation</legend>
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I confirm that the information provided above is correct</label>
                </div>
              </fieldset>
              <!-- button -->
               <div class="buttons">
                <button type="submit" class="submit-btn">Submit Application</button>
                 <button type="reset" class="reset-btn">Reset Form</button>
               </div>
        </form>
    </main>
</body>

</html>
